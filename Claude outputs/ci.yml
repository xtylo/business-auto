name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Activities and API: no server needed.
      - run: npm run test:unit

      # Workflows: downloads Temporal's time-skipping test server on first use.
      - run: npm run test:workflows
