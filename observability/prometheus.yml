# Prometheus pulls ("scrapes") metrics from the processes listed below.
# "app" is the dev container: the API and the worker both run inside it.
# A target shows as DOWN while its process is not running; that is expected.

global:
  # Short interval so a 2-3 minute load test produces enough points to read.
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["app:9465"]

  - job_name: worker
    static_configs:
      - targets: ["app:9464"]
